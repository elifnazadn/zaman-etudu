<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
  <meta name="theme-color" content="#8FA7E8">
  <meta name="apple-mobile-web-app-title" content="Zaman Etüdü">
  <title>Zaman Etüdü</title>

  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <style>
    :root{
      --bg:#f4f4fa;
      --card:#fff;
      --text:#252238;
      --muted:#7b778d;
      --line:#e8e5f1;
      --blue:#8fa7e8;
      --blue-dark:#647dc5;
      --purple:#ad9bdd;
      --purple-dark:#7966b3;
      --pink:#efb8d1;
      --pink-dark:#ad6385;
      --blue-soft:#edf2ff;
      --purple-soft:#f2effb;
      --pink-soft:#fff0f6;
      --shadow:0 12px 34px rgba(75,67,113,.09);
      --black:#000;
      --dark-card:#151515;
      --dark-line:#292929;
      --green:#36d65c;
      --red:#ff5a5f;
    }

    *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
    html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
    body{background:var(--bg);color:var(--text);padding-bottom:env(safe-area-inset-bottom)}
    button,input{font:inherit}
    button{touch-action:manipulation}

    .screen{display:none;min-height:100dvh}
    .screen.active{display:block}

    .setup-wrap,.results-wrap{max-width:720px;margin:auto;padding:14px}
    .setup-header{
      padding:24px 20px;
      margin-bottom:14px;
      border-radius:26px;
      background:linear-gradient(135deg,var(--blue),var(--purple));
      color:#fff;
      box-shadow:var(--shadow);
    }
    .setup-header h1{margin:0;font-size:28px;letter-spacing:-.6px}
    .setup-header p{margin:7px 0 0;font-size:14px;line-height:1.45;opacity:.95}

    .card{
      background:var(--card);
      border:1px solid #efedf5;
      border-radius:24px;
      padding:18px;
      margin-bottom:13px;
      box-shadow:var(--shadow);
    }
    .section-title{margin:0 0 14px;font-size:18px;font-weight:900;letter-spacing:-.25px}
    .field-label{display:block;margin:0 0 7px;font-size:13px;font-weight:850;color:#69657a}
    input{
      width:100%;
      min-height:52px;
      padding:13px 15px;
      border:1px solid var(--line);
      border-radius:16px;
      outline:0;
      background:#fff;
      color:var(--text);
    }
    input:focus{border-color:var(--blue);box-shadow:0 0 0 4px var(--blue-soft)}
    .field-gap{margin-top:15px}

    .mode-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .mode-btn{
      min-height:106px;
      padding:15px;
      border:1px solid var(--line);
      border-radius:19px;
      background:#fff;
      color:var(--muted);
      text-align:left;
      font-weight:900;
    }
    .mode-btn strong{display:block;font-size:18px;margin-bottom:7px}
    .mode-btn small{display:block;font-size:12px;line-height:1.4;font-weight:700}
    .mode-btn.active{background:var(--blue-soft);border-color:var(--blue);color:var(--blue-dark)}

    .stage-list{display:grid;gap:9px}
    .stage-row{display:grid;grid-template-columns:42px 1fr 42px 42px 44px;gap:7px;align-items:center}
    .stage-number{
      width:42px;height:42px;display:grid;place-items:center;
      border-radius:13px;background:var(--purple-soft);color:var(--purple-dark);font-weight:900
    }
    
    .stage-move{
      width:42px;height:42px;border:0;border-radius:13px;
      background:var(--blue-soft);color:var(--blue-dark);
      font-size:18px;font-weight:900;
    }
    .stage-move:disabled{opacity:.3}

    .stage-delete{
      width:44px;height:44px;border:0;border-radius:13px;
      background:var(--pink-soft);color:var(--pink-dark);font-size:22px;font-weight:900
    }
    .add-stage-row{display:grid;grid-template-columns:1fr auto;gap:9px;margin-top:10px}
    .btn{
      min-height:52px;padding:13px 17px;border:0;border-radius:17px;
      font-weight:900;cursor:pointer;transition:transform .14s ease,opacity .14s ease
    }
    .btn:active{transform:scale(.98)}
    .btn:disabled{opacity:.4}
    .btn-primary{background:linear-gradient(135deg,var(--blue),var(--purple));color:#fff}
    .btn-soft{background:var(--purple-soft);color:var(--purple-dark)}
    .btn-pink{background:var(--pink-soft);color:var(--pink-dark)}
    .start-study{width:100%;min-height:62px;font-size:17px;margin-top:4px}
    .setup-note{font-size:12px;color:var(--muted);line-height:1.5;margin-top:10px}

    /* Ölçüm ekranı — uygulamanın mevcut lila/mavi tasarımı */
    #measureScreen{
      background:
        radial-gradient(circle at 50% -12%,rgba(143,167,232,.16),transparent 34%),
        var(--bg);
      color:var(--text);
    }

    .measure-shell{
      min-height:100dvh;
      max-width:720px;
      margin:auto;
      padding:max(12px,env(safe-area-inset-top)) 14px max(20px,env(safe-area-inset-bottom));
      display:flex;
      flex-direction:column;
    }

    .measure-top{
      display:grid;
      grid-template-columns:46px 1fr 46px;
      align-items:center;
      gap:8px;
      min-height:66px;
      padding:9px 10px;
      margin-bottom:12px;
      border:1px solid #efedf5;
      border-radius:21px;
      background:rgba(255,255,255,.94);
      box-shadow:var(--shadow);
    }

    .icon-btn{
      width:42px;
      height:42px;
      border:0;
      border-radius:14px;
      background:var(--purple-soft);
      color:var(--purple-dark);
      font-size:27px;
      font-weight:800;
    }

    .measure-heading{text-align:center;min-width:0}

    .measure-operation{
      font-size:17px;
      font-weight:950;
      color:var(--text);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .measure-stage{
      margin-top:3px;
      font-size:12px;
      color:var(--muted);
      font-weight:800;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .measure-counter{
      flex:0 0 auto;
      margin-bottom:13px;
      padding:34px 14px 30px;
      text-align:center;
      border:1px solid #eae7f3;
      border-radius:28px;
      background:
        radial-gradient(circle at 50% 0%,rgba(173,155,221,.16),transparent 46%),
        linear-gradient(180deg,#fff,#faf9fd);
      box-shadow:var(--shadow);
    }

    .timer{
      font-size:clamp(56px,15vw,94px);
      line-height:1;
      letter-spacing:-5px;
      font-weight:900;
      color:#242235;
      font-variant-numeric:tabular-nums;
      white-space:nowrap;
    }

    .cycle-text{
      display:inline-block;
      margin-top:22px;
      padding:7px 13px;
      border-radius:999px;
      background:var(--purple-soft);
      color:var(--purple-dark);
      font-size:13px;
      font-weight:900;
    }

    .round-controls{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:11px;
      margin:0 0 11px;
    }

    .round-btn{
      width:100%;
      height:auto;
      min-height:62px;
      border:0;
      border-radius:19px;
      outline:0;
      background:var(--purple-soft);
      color:var(--purple-dark);
      font-size:17px;
      font-weight:900;
      box-shadow:0 8px 20px rgba(93,83,137,.08);
      transition:transform .12s ease,opacity .12s ease;
    }

    .round-btn:active{transform:scale(.98)}

    .round-btn.green{
      background:linear-gradient(135deg,var(--blue),var(--purple));
      color:#fff;
      outline:0;
    }

    .round-btn.red{
      background:var(--pink);
      color:#593247;
      outline:0;
    }

    .round-btn:disabled{opacity:.38}

    .measure-actions{
      display:grid;
      grid-template-columns:1fr 1fr;
      gap:10px;
      margin-bottom:13px;
    }

    .dark-action{
      min-height:50px;
      border:1px solid var(--line);
      border-radius:16px;
      background:#fff;
      color:var(--purple-dark);
      font-weight:900;
      box-shadow:0 7px 18px rgba(75,67,113,.055);
    }

    .dark-action.finish{
      background:var(--blue-soft);
      color:var(--blue-dark);
      border-color:#dfe6fb;
    }

    .dark-action:disabled{opacity:.38}

    .laps{
      flex:1 1 auto;
      max-height:none;
      overflow:auto;
      padding:5px 16px 14px;
      border:1px solid #efedf5;
      border-radius:23px;
      background:#fff;
      box-shadow:var(--shadow);
    }

    .lap-empty{
      text-align:center;
      color:var(--muted);
      padding:34px 10px;
      font-size:14px;
    }

    .lap-row{
      display:grid;
      grid-template-columns:40px 1fr auto;
      gap:10px;
      align-items:center;
      min-height:55px;
      border-bottom:1px solid #f0edf6;
      color:var(--text);
      font-variant-numeric:tabular-nums;
    }

    .lap-no{
      width:30px;
      height:30px;
      display:grid;
      place-items:center;
      border-radius:10px;
      background:var(--blue-soft);
      color:var(--blue-dark);
      font-size:12px;
      font-weight:900;
    }

    .lap-name{
      font-size:14px;
      font-weight:850;
      overflow:hidden;
      text-overflow:ellipsis;
      white-space:nowrap;
    }

    .lap-value{
      font-size:17px;
      font-weight:950;
      color:var(--purple-dark);
    }

    .cycle-divider{
      padding:15px 0 7px;
      color:var(--muted);
      font-size:11px;
      font-weight:950;
      text-transform:uppercase;
      letter-spacing:.06em;
    }



    /* Sonuç ekranı */
    .results-header{
      display:flex;align-items:center;justify-content:space-between;gap:10px;
      margin:4px 0 14px
    }
    .results-header h1{margin:0;font-size:27px;letter-spacing:-.6px}
    .back-text{
      border:0;background:transparent;color:var(--purple-dark);
      font-weight:900;padding:10px 2px
    }
    .result-summary{
      display:grid;grid-template-columns:repeat(2,1fr);gap:10px
    }
    .result-summary .summary-box:last-child:nth-child(odd){grid-column:1/-1}
    .summary-box{
      padding:15px;border-radius:17px;background:var(--purple-soft);text-align:center
    }
    .summary-box:nth-child(2){background:var(--blue-soft)}
    .summary-box:nth-child(3){background:var(--pink-soft)}
    .summary-box:nth-child(4){background:#f5f3fa}
    .summary-label{font-size:11px;color:var(--muted);font-weight:850;line-height:1.35}
    .summary-value{margin-top:6px;font-size:21px;font-weight:950;font-variant-numeric:tabular-nums}

    .cycle-cards{display:grid;gap:11px}
    .cycle-card{border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .cycle-head{
      display:flex;justify-content:space-between;gap:10px;align-items:center;
      padding:13px 14px;background:var(--blue-soft)
    }
    .cycle-title{font-size:15px;font-weight:950;color:#526aa8}
    .cycle-meta{font-size:11px;color:var(--muted);font-weight:750;margin-top:2px}
    .cycle-delete{border:0;border-radius:11px;background:var(--pink-soft);color:var(--pink-dark);padding:8px 11px;font-weight:900}
    .cycle-body{padding:12px 14px}
    .metric-row{
      display:flex;justify-content:space-between;gap:14px;
      padding:10px 0;border-bottom:1px solid #f0edf6
    }
    .metric-row:last-child{border-bottom:0}
    .metric-row.total{margin-top:3px;padding:11px 10px;background:var(--pink-soft);border-radius:12px;border:0}
    .metric-name{font-size:13px;color:var(--muted);font-weight:750}
    .metric-value{font-size:14px;font-weight:950;font-variant-numeric:tabular-nums}

    .stats-table{border:1px solid var(--line);border-radius:18px;overflow:hidden}
    .stats-title{padding:13px 14px;background:var(--purple-soft);font-weight:950;color:var(--purple-dark)}
    .stat-row{
      display:grid;grid-template-columns:minmax(100px,1.5fr) repeat(3,minmax(58px,.75fr));
      gap:5px;align-items:center;padding:10px 11px;border-top:1px solid var(--line);font-size:12px
    }
    .stat-row.header{background:#faf9fd;color:var(--muted);font-weight:850}
    .stat-name{font-weight:850;word-break:break-word}
    .stat-value{text-align:center;font-weight:850;font-variant-numeric:tabular-nums}

    .empty{text-align:center;padding:25px;color:var(--muted)}
    .results-actions{display:grid;grid-template-columns:1fr 1fr;gap:9px}
    .toast{
      position:fixed;left:50%;bottom:30px;transform:translateX(-50%);
      padding:11px 15px;border-radius:999px;background:#25222f;color:#fff;
      font-size:13px;font-weight:800;opacity:0;pointer-events:none;transition:.2s;z-index:50
    }
    .toast.show{opacity:1}

    @media(max-width:520px){
      .setup-wrap,.results-wrap{padding:9px}
      .setup-header{border-radius:21px;padding:21px 18px}
      .setup-header h1{font-size:25px}
      .card{border-radius:21px;padding:16px}
      .mode-btn{min-height:112px;padding:13px}
      .mode-btn strong{font-size:17px}
      .add-stage-row{grid-template-columns:1fr 105px}
      .measure-shell{padding-left:9px;padding-right:9px}
      .measure-top{border-radius:18px}
      .measure-counter{padding:31px 8px 27px;border-radius:24px}
      .timer{letter-spacing:-4px}
      .round-btn{min-height:60px;font-size:16px}
      .laps{border-radius:20px;padding-left:13px;padding-right:13px}
    }
  </style>
</head>

<body>
  <!-- 1. KURULUM -->
  <section id="setupScreen" class="screen active">
    <div class="setup-wrap">
      <header class="setup-header">
        <h1>Zaman Etüdü</h1>
        <p>Ölçüm bilgilerini hazırla, ardından sade kronometre ekranına geç.</p>
      </header>

      <div class="card">
        <h2 class="section-title">Çalışma Bilgileri</h2>

        <label class="field-label" for="studyName">Operasyon adı</label>
        <input id="studyName" maxlength="60" placeholder="Örneğin: Taşlama">

        <div class="field-gap">
          <label class="field-label" for="productQty">Ürün adedi</label>
          <input id="productQty" type="number" min="1" step="1" inputmode="numeric" value="1">
        </div>
      </div>

      <div class="card">
        <h2 class="section-title">Ölçüm Biçimi</h2>
        <div class="mode-grid">
          <button id="totalModeBtn" class="mode-btn active" type="button">
            <strong>Tek Süre</strong>
            <small>Tüm işlemi tek süre olarak ölçer.</small>
          </button>
          <button id="detailModeBtn" class="mode-btn" type="button">
            <strong>Çok Adımlı</strong>
            <small>Adımları Tur ile ayrı ayrı ölçer.</small>
          </button>
        </div>
      </div>

      <div id="stagesCard" class="card" hidden>
        <h2 class="section-title">İşlem Adımları</h2>
        <div id="stageList" class="stage-list"></div>
        <div class="add-stage-row">
          <input id="stageName" maxlength="80" placeholder="Adım adı">
          <button id="addStageBtn" class="btn btn-primary" type="button">Adım ekle</button>
        </div>
        <div class="setup-note">Adımlar eklenme sırasına göre ölçülür.</div>
      </div>

      <button id="beginStudyBtn" class="btn btn-primary start-study" type="button">Ölçüme Başla</button>
    </div>
  </section>

  <!-- 2. ÖLÇÜM -->
  <section id="measureScreen" class="screen">
    <div class="measure-shell">
      <div class="measure-top">
        <button id="backSetupBtn" class="icon-btn" type="button" aria-label="Geri">‹</button>
        <div class="measure-heading">
          <div id="measureOperation" class="measure-operation">—</div>
          <div id="measureStage" class="measure-stage">Hazır</div>
        </div>
        <span></span>
      </div>

      <div class="measure-counter">
        <div id="timer" class="timer">00:00,00</div>
        <div id="cycleText" class="cycle-text">Çevrim 1</div>
      </div>

      <div id="idleControls" class="round-controls">
        <button id="resetBtn" class="round-btn" type="button">Sıfırla</button>
        <button id="startBtn" class="round-btn green" type="button">Başlat</button>
      </div>

      <div id="runningControls" class="round-controls" hidden>
        <button id="lapBtn" class="round-btn" type="button">Tur</button>
        <button id="stopBtn" class="round-btn red" type="button">Durdur</button>
      </div>

      <div class="measure-actions">
        <button id="newCycleBtn" class="dark-action" type="button">Yeni Çevrim</button>
        <button id="finishBtn" class="dark-action finish" type="button">Sonuçları Gör</button>
      </div>

      <div id="laps" class="laps"></div>
    </div>
  </section>

  <!-- 3. SONUÇLAR -->
  <section id="resultsScreen" class="screen">
    <div class="results-wrap">
      <div class="results-header">
        <button id="backMeasureBtn" class="back-text" type="button">‹ Ölçüme dön</button>
        <h1>Sonuçlar</h1>
        <span style="width:78px"></span>
      </div>

      <div class="card">
        <h2 id="resultStudyName" class="section-title">—</h2>
        <div id="resultSummary" class="result-summary"></div>
      </div>

      <div id="statsCard" class="card">
        <h2 class="section-title">İstatistikler</h2>
        <div id="stageStats"></div>
      </div>

      <div class="card">
        <h2 class="section-title">Kaydedilen Çevrimler</h2>
        <div id="cycleResults"></div>
      </div>

      <div class="results-actions">
        <button id="deleteLastBtn" class="btn btn-soft" type="button">Son çevrimi sil</button>
        <button id="newStudyBtn" class="btn btn-pink" type="button">Yeni çalışma</button>
      </div>
    </div>
  </section>

  <div id="toast" class="toast"></div>

<script>
(() => {
  const STORAGE_KEY = 'time_study_three_screen_v1';
  const $ = id => document.getElementById(id);

  const el = {
    setupScreen:$('setupScreen'), measureScreen:$('measureScreen'), resultsScreen:$('resultsScreen'),
    studyName:$('studyName'), productQty:$('productQty'),
    totalModeBtn:$('totalModeBtn'), detailModeBtn:$('detailModeBtn'),
    stagesCard:$('stagesCard'), stageList:$('stageList'), stageName:$('stageName'), addStageBtn:$('addStageBtn'),
    beginStudyBtn:$('beginStudyBtn'),
    backSetupBtn:$('backSetupBtn'), measureOperation:$('measureOperation'), measureStage:$('measureStage'),
    timer:$('timer'), cycleText:$('cycleText'),
    idleControls:$('idleControls'), runningControls:$('runningControls'),
    resetBtn:$('resetBtn'), startBtn:$('startBtn'), lapBtn:$('lapBtn'), stopBtn:$('stopBtn'),
    newCycleBtn:$('newCycleBtn'), finishBtn:$('finishBtn'), laps:$('laps'),
    backMeasureBtn:$('backMeasureBtn'), resultStudyName:$('resultStudyName'),
    resultSummary:$('resultSummary'), statsCard:$('statsCard'), stageStats:$('stageStats'),
    cycleResults:$('cycleResults'), deleteLastBtn:$('deleteLastBtn'), newStudyBtn:$('newStudyBtn'),
    toast:$('toast')
  };

  let state = loadState();
  let run = blankRun();
  let wakeLock = null;

  function defaultState(){
    return {
      mode:'total',
      name:'',
      productQty:1,
      stages:[],
      cycles:[],
      activeScreen:'setup'
    };
  }

  function blankRun(){
    return {
      running:false,
      elapsed:0,
      startedAt:0,
      stageIndex:0,
      values:[],
      interval:null
    };
  }

  function loadState(){
    try{
      const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
      if(!saved) return defaultState();
      return {...defaultState(), ...saved};
    }catch{
      return defaultState();
    }
  }

  function saveState(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  }

  function showScreen(name){
    ['setup','measure','results'].forEach(key=>{
      el[key+'Screen'].classList.toggle('active', key===name);
    });
    state.activeScreen=name;
    saveState();
    window.scrollTo(0,0);
  }

  function showToast(message){
    el.toast.textContent=message;
    el.toast.classList.add('show');
    clearTimeout(showToast.timer);
    showToast.timer=setTimeout(()=>el.toast.classList.remove('show'),1800);
  }

  function escapeHtml(value){
    return String(value).replace(/[&<>'"]/g, c => ({
      '&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'
    }[c]));
  }

  function formatTimer(ms){
    const min=Math.floor(ms/60000);
    const sec=Math.floor(ms/1000)%60;
    const cs=Math.floor((ms%1000)/10);
    return `${String(min).padStart(2,'0')}:${String(sec).padStart(2,'0')},${String(cs).padStart(2,'0')}`;
  }

  function seconds(ms){
    return Number((ms/1000).toFixed(2));
  }

  function renderSetup(){
    el.studyName.value=state.name;
    el.productQty.value=state.productQty;
    el.totalModeBtn.classList.toggle('active',state.mode==='total');
    el.detailModeBtn.classList.toggle('active',state.mode==='detail');
    el.stagesCard.hidden=state.mode!=='detail';

    el.stageList.innerHTML='';
    if(!state.stages.length){
      el.stageList.innerHTML='<div class="empty">Henüz adım eklenmedi.</div>';
    }else{
      state.stages.forEach((stage,index)=>{
        const row=document.createElement('div');
        row.className='stage-row';
        row.innerHTML=`
          <div class="stage-number">${index+1}</div>
          <input value="${escapeHtml(stage)}" aria-label="${index+1}. adım">
          <button class="stage-move" type="button" data-move="up" aria-label="Yukarı taşı">↑</button>
          <button class="stage-move" type="button" data-move="down" aria-label="Aşağı taşı">↓</button>
          <button class="stage-delete" type="button" aria-label="Sil">×</button>
        `;
        const input=row.querySelector('input');
        const moveUp=row.querySelector('[data-move="up"]');
        const moveDown=row.querySelector('[data-move="down"]');
        const del=row.querySelector('.stage-delete');

        moveUp.disabled=index===0;
        moveDown.disabled=index===state.stages.length-1;

        moveUp.addEventListener('click',()=>{
          if(index===0) return;
          [state.stages[index-1],state.stages[index]]=[state.stages[index],state.stages[index-1]];
          state.cycles=[];
          saveState();
          renderSetup();
        });

        moveDown.addEventListener('click',()=>{
          if(index>=state.stages.length-1) return;
          [state.stages[index+1],state.stages[index]]=[state.stages[index],state.stages[index+1]];
          state.cycles=[];
          saveState();
          renderSetup();
        });

        input.addEventListener('change',()=>{
          const value=input.value.trim();
          if(!value){ input.value=stage; return; }
          state.stages[index]=value;
          saveState();
        });

        del.addEventListener('click',()=>{
          state.stages.splice(index,1);
          state.cycles=[];
          saveState();
          renderSetup();
        });

        el.stageList.appendChild(row);
      });
    }
  }

  function validateSetup(){
    state.name=el.studyName.value.trim();
    state.productQty=Math.max(1,Math.floor(Number(el.productQty.value)||1));

    if(!state.name){
      showToast('Operasyon adını yazın');
      el.studyName.focus();
      return false;
    }
    if(state.mode==='detail' && !state.stages.length){
      showToast('En az bir adım ekleyin');
      el.stageName.focus();
      return false;
    }
    saveState();
    return true;
  }

  function currentStageName(){
    if(state.mode==='total') return 'Tek Süre';
    return state.stages[Math.min(run.stageIndex,state.stages.length-1)] || '—';
  }

  function renderMeasure(){
    el.measureOperation.textContent=state.name || '—';
    el.measureStage.textContent=state.mode==='total'
      ? 'Tek süre'
      : `${run.stageIndex+1}. adım · ${currentStageName()}`;

    el.timer.textContent=formatTimer(run.elapsed);
    el.cycleText.textContent=`Çevrim ${state.cycles.length+1}`;

    el.idleControls.hidden=run.running;
    el.runningControls.hidden=!run.running;

    el.startBtn.textContent=run.elapsed>0?'Devam':'Başlat';
    el.resetBtn.disabled=!run.elapsed && !run.values.length;
    el.lapBtn.disabled=!run.running;
    el.newCycleBtn.hidden=state.mode==='total';
    el.newCycleBtn.disabled=run.running || (run.elapsed===0 && run.values.length===0);
    el.finishBtn.disabled=run.running || state.cycles.length===0;

    renderLaps();
  }

  function renderLaps(){
    if(!state.cycles.length && !run.values.length){
      el.laps.innerHTML='<div class="lap-empty">Tur aldıkça adım süreleri burada görünecek.</div>';
      return;
    }

    let html='';
    [...state.cycles].reverse().forEach((cycle,reverseIndex)=>{
      const cycleNumber=state.cycles.length-reverseIndex;
      html+=`<div class="cycle-divider">${cycleNumber}. çevrim</div>`;
      normalizedValues(cycle).forEach((value,index)=>{
        const name=state.mode==='total'?'Tek Süre':state.stages[index];
        html+=`
          <div class="lap-row">
            <div class="lap-no">${index+1}</div>
            <div class="lap-name">${escapeHtml(name||'Adım')}</div>
            <div class="lap-value">${value.toFixed(2)} sn</div>
          </div>`;
      });
    });

    if(run.values.length){
      html+=`<div class="cycle-divider">${state.cycles.length+1}. çevrim · devam ediyor</div>`;
      run.values.forEach((raw,index)=>{
        const value=raw/state.productQty;
        const name=state.mode==='total'?'Tek Süre':state.stages[index];
        html+=`
          <div class="lap-row">
            <div class="lap-no">${index+1}</div>
            <div class="lap-name">${escapeHtml(name||'Adım')}</div>
            <div class="lap-value">${value.toFixed(2)} sn</div>
          </div>`;
      });
    }
    el.laps.innerHTML=html;
  }

  function start(){
    if(run.running) return;
    run.running=true;
    run.startedAt=performance.now()-run.elapsed;
    run.interval=setInterval(tick,20);
    keepAwake();
    renderMeasure();
  }

  function tick(){
    run.elapsed=performance.now()-run.startedAt;
    el.timer.textContent=formatTimer(run.elapsed);
  }

  function stop(){
    if(!run.running) return;
    tick();
    run.running=false;
    clearInterval(run.interval);
    releaseWake();
    renderMeasure();
  }

  function reset(){
    clearInterval(run.interval);
    releaseWake();
    run=blankRun();
    renderMeasure();
    showToast('Ölçüm sıfırlandı');
  }

  function lap(){
    if(!run.running) return;
    tick();
    const raw=seconds(run.elapsed);

    if(state.mode==='total'){
      state.cycles.push({
        productQty:state.productQty,
        rawValues:[raw]
      });
      saveState();
      run.elapsed=0;
      run.values=[];
      run.stageIndex=0;
      run.startedAt=performance.now();
      renderMeasure();
      showToast('Çevrim kaydedildi');
      return;
    }

    run.values[run.stageIndex]=raw;
    run.elapsed=0;

    if(run.stageIndex >= state.stages.length-1){
      state.cycles.push({
        productQty:state.productQty,
        rawValues:[...run.values]
      });
      saveState();

      // Son adım kaydedildiğinde yeni çevrim otomatik başlar.
      run.values=[];
      run.stageIndex=0;
      run.elapsed=0;
      run.startedAt=performance.now();

      renderMeasure();
      showToast('Çevrim kaydedildi, yenisi başladı');
    }else{
      run.stageIndex++;
      run.startedAt=performance.now();
      renderMeasure();
    }
  }

  function newCycle(){
    if(state.mode==='total' || run.running) return;
    if(run.elapsed || run.values.length){
      run=blankRun();
      renderMeasure();
      showToast('Yarım çevrim silindi, yeni çevrim hazır');
    }
  }

  function normalizedValues(cycle){
    const qty=Math.max(1,Number(cycle.productQty)||1);
    return (cycle.rawValues||[]).map(v=>Number(v)/qty);
  }

  function stageStatistics(){
    const names=state.mode==='total'?['Tek Süre']:state.stages;
    return names.map((name,index)=>{
      const values=state.cycles
        .map(c=>normalizedValues(c)[index])
        .filter(Number.isFinite);
      return {
        name,
        average:values.length?values.reduce((a,b)=>a+b,0)/values.length:0,
        minimum:values.length?Math.min(...values):0,
        maximum:values.length?Math.max(...values):0
      };
    });
  }

  function renderResults(){
    el.resultStudyName.textContent=state.name;
    const stats=stageStatistics();
    const averageTotal=stats.reduce((s,x)=>s+x.average,0);
    const minimumTotal=stats.reduce((s,x)=>s+x.minimum,0);
    const maximumTotal=stats.reduce((s,x)=>s+x.maximum,0);

    el.resultSummary.innerHTML=`
      <div class="summary-box">
        <div class="summary-label">${state.mode==='total'?'Ortalama Süre':'Toplam Ortalama Süre'}</div>
        <div class="summary-value">${averageTotal.toFixed(2)} sn</div>
      </div>
      <div class="summary-box">
        <div class="summary-label">Çevrim Sayısı</div>
        <div class="summary-value">${state.cycles.length}</div>
      </div>
      <div class="summary-box">
        <div class="summary-label">Ürün adedi</div>
        <div class="summary-value">${state.productQty}</div>
      </div>
    `;

    el.statsCard.hidden=!state.cycles.length;
    if(state.cycles.length){
      let html=`
        <div class="stats-table">
          <div class="stats-title">${state.mode==='total'?'Süre İstatistikleri':'Adım İstatistikleri'}</div>
          <div class="stat-row header">
            <div>${state.mode==='total'?'Ölçüm':'Adım'}</div><div>Ort.</div><div>Min.</div><div>Maks.</div>
          </div>`;
      stats.forEach(stat=>{
        html+=`
          <div class="stat-row">
            <div class="stat-name">${escapeHtml(stat.name)}</div>
            <div class="stat-value">${stat.average.toFixed(2)}</div>
            <div class="stat-value">${stat.minimum.toFixed(2)}</div>
            <div class="stat-value">${stat.maximum.toFixed(2)}</div>
          </div>`;
      });
      html+='</div>';
      el.stageStats.innerHTML=html;
    }

    if(!state.cycles.length){
      el.cycleResults.innerHTML='<div class="empty">Henüz kaydedilmiş çevrim yok.</div>';
      return;
    }

    let html='<div class="cycle-cards">';
    state.cycles.forEach((cycle,cycleIndex)=>{
      const values=normalizedValues(cycle);
      const total=values.reduce((a,b)=>a+b,0);
      html+=`
        <article class="cycle-card">
          <div class="cycle-head">
            <div>
              <div class="cycle-title">${cycleIndex+1}. Çevrim</div>
              <div class="cycle-meta">${cycle.productQty} ürün · ürün başına süre</div>
            </div>
            <button class="cycle-delete" data-delete-cycle="${cycleIndex}" type="button">Sil</button>
          </div>
          <div class="cycle-body">
            <div class="metric-row">
              <span class="metric-name">Ürün adedi</span>
              <span class="metric-value">${cycle.productQty}</span>
            </div>`;

      values.forEach((value,index)=>{
        const name=state.mode==='total'?'Tek Süre':state.stages[index];
        html+=`
          <div class="metric-row">
            <span class="metric-name">${escapeHtml(name||'Adım')}</span>
            <span class="metric-value">${value.toFixed(2)} sn</span>
          </div>`;
      });

      if(state.mode==='detail'){
        html+=`
          <div class="metric-row total">
            <span class="metric-name">Çevrim Sayısı</span>
            <span class="metric-value">${total.toFixed(2)} sn</span>
          </div>`;
      }

      html+='</div></article>';
    });
    html+='</div>';
    el.cycleResults.innerHTML=html;
  }

  async function keepAwake(){
    try{
      if('wakeLock' in navigator) wakeLock=await navigator.wakeLock.request('screen');
    }catch{}
  }

  async function releaseWake(){
    try{ if(wakeLock) await wakeLock.release(); }catch{}
    wakeLock=null;
  }

  el.totalModeBtn.addEventListener('click',()=>{
    state.mode='total';
    state.cycles=[];
    run=blankRun();
    saveState();
    renderSetup();
  });

  el.detailModeBtn.addEventListener('click',()=>{
    state.mode='detail';
    state.cycles=[];
    run=blankRun();
    saveState();
    renderSetup();
  });

  el.addStageBtn.addEventListener('click',()=>{
    const name=el.stageName.value.trim();
    if(!name){ showToast('Adım adını yazın'); return; }
    state.stages.push(name);
    state.cycles=[];
    el.stageName.value='';
    saveState();
    renderSetup();
  });

  el.stageName.addEventListener('keydown',e=>{
    if(e.key==='Enter') el.addStageBtn.click();
  });

  el.beginStudyBtn.addEventListener('click',()=>{
    if(!validateSetup()) return;
    run=blankRun();
    renderMeasure();
    showScreen('measure');
  });

  el.backSetupBtn.addEventListener('click',()=>{
    if(run.running){
      showToast('Önce kronometreyi durdurun');
      return;
    }
    renderSetup();
    showScreen('setup');
  });

  el.startBtn.addEventListener('click',start);
  el.stopBtn.addEventListener('click',stop);
  el.resetBtn.addEventListener('click',reset);
  el.lapBtn.addEventListener('click',lap);
  el.newCycleBtn.addEventListener('click',newCycle);

  el.finishBtn.addEventListener('click',()=>{
    if(run.running){ showToast('Önce kronometreyi durdurun'); return; }
    if(!state.cycles.length){ showToast('Önce en az bir çevrim kaydedin'); return; }
    renderResults();
    showScreen('results');
  });

  el.backMeasureBtn.addEventListener('click',()=>{
    renderMeasure();
    showScreen('measure');
  });

  el.cycleResults.addEventListener('click',e=>{
    const btn=e.target.closest('[data-delete-cycle]');
    if(!btn) return;
    const index=Number(btn.dataset.deleteCycle);
    state.cycles.splice(index,1);
    saveState();
    renderResults();
    renderMeasure();
    showToast('Çevrim silindi');
  });

  el.deleteLastBtn.addEventListener('click',()=>{
    if(!state.cycles.length){ showToast('Silinecek çevrim yok'); return; }
    state.cycles.pop();
    saveState();
    renderResults();
    renderMeasure();
    showToast('Son çevrim silindi');
  });

  el.newStudyBtn.addEventListener('click',()=>{
    if(!confirm('Yeni çalışma başlatılsın mı? Mevcut ölçümler silinecek.')) return;
    state=defaultState();
    run=blankRun();
    saveState();
    renderSetup();
    showScreen('setup');
  });

  document.addEventListener('visibilitychange',()=>{
    if(document.visibilityState==='visible' && run.running) keepAwake();
  });

  renderSetup();
  if(state.activeScreen==='results' && state.cycles.length){
    renderResults();
    showScreen('results');
  }else if(state.activeScreen==='measure' && state.name){
    renderMeasure();
    showScreen('measure');
  }else{
    showScreen('setup');
  }
})();
</script>
</body>
</html>
